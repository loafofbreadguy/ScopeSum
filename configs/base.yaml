# Shared settings. Variant files (variant_A.yaml ... variant_E.yaml) and
# hardware files (hw_t4.yaml, hw_l4.yaml) are merged on top of this one.
# Values marked VERIFY could not be checked offline: the notebooks print
# what actually exists so you can fix them here.

model:
  model_id: google/gemma-4-E2B          # base checkpoint; google/gemma-4-E4B for the larger run
  source: hf                            # hf | kagglehub | local
  kagglehub_handle: google/gemma-4/transformers/gemma-4-e2b   # VERIFY on Kaggle Models
  local_path: null                      # e.g. /kaggle/input/gemma-4/transformers/gemma-4-e2b/1
  model_class: auto                     # auto | causal_lm | conditional_generation
  dtype: float16
  load_in_4bit: false
  attn_implementation: sdpa             # sdpa | eager (both accept our dense 4D mask)
  device_map: null                      # null = cuda:0; "auto" splits layers over 2 GPUs
  drop_multimodal_towers: true
  sum_token: "<unused0>"                # id 6 in the Gemma 4 tokenizer; reused as <sum>
  sum_token_mode: reuse
  reinit_ple_row: true
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_regex: '.*language_model.*\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$'

variant:
  id: A
  window: null          # W for B/C (null = model sliding_window, 512 for Gemma 4 E2B/E4B)
  w_small: 64           # D/E recent-token window
  chunk_size: null      # K for B (null = read from <data.out_dir>/stats.json)
  all_descendants: false

data:
  dataset_id: bigcode/the-stack-smol-xl
  dataset_config: null
  data_dir: data/python
  split: train
  streaming: false
  text_field: content                   # VERIFY (discovery cell in 01_data_prep)
  repo_field: max_stars_repo_name       # VERIFY
  path_field: max_stars_repo_path       # VERIFY
  local_files_glob: null
  excluded_repos: [fastapi, requests, rich, httpx]          # long-range eval repos (name parts, paths, signatures)
  excluded_repos_exact: [astropy, django, matplotlib, seaborn, flask, requests, xarray, pylint, pytest, scikit-learn, sphinx, sympy]  # SWE-bench Lite repos (exact name)
  min_tokens: 1024
  seq_len: 2048
  sum_reserve: 256
  min_window_tokens: 256
  token_budget: 10000000
  heldout_fraction: 0.01
  max_files: null
  out_dir: /kaggle/working/scopesum_data
  seed: 1234

train:
  out_dir: /kaggle/working/scopesum_runs
  resume_from: null
  lr: 2.0e-4
  sum_embed_lr: 1.0e-3
  weight_decay: 0.0
  warmup_steps: 50
  batch_size: 1
  grad_accum: 16
  max_steps: null       # null = token_budget / (batch_size * grad_accum * raw tokens per example)
  max_grad_norm: 1.0
  log_every: 10
  save_every: 25        # ~30 min on a T4; a killed session loses at most this much
  keep_last_checkpoints: 2
  seed: 1234
  loss_chunk: 512
  max_hours: 11.0

eval:
  out_dir: /kaggle/working/scopesum_eval
  checkpoints: {}       # e.g. {A: /kaggle/input/runs-a/final, C: /kaggle/input/runs-c/final}
  long_range_distance: 512
  eval_files_glob: null # null = clone eval_repo_urls into eval_repos_dir and use their .py files
  max_eval_files: 200
  eval_repos_dir: /kaggle/working/eval_repos
  eval_repo_urls:
    - https://github.com/fastapi/fastapi
    - https://github.com/psf/requests
    - https://github.com/Textualize/rich
    - https://github.com/encode/httpx
  # bug localization: SWE-bench Lite (files fetched from GitHub at each task's base_commit)
  localize_source: swebench      # swebench | jsonl (tasks.jsonl + snapshots/ under competition_dir)
  swebench_dataset: princeton-nlp/SWE-bench_Lite
  swebench_split: test
  commit_field: base_commit
  file_cache_dir: /kaggle/working/localize_files
  task_id_field: instance_id
  issue_field: problem_statement
  patch_field: patch
  repo_field: repo
  # jsonl mode only:
  competition_dir: /kaggle/input/localize-tasks
  tasks_file: tasks.jsonl
  snapshots_dir: snapshots
  graphs_dir: graphs
  snapshot_field: snapshot
  max_tasks: null
  max_issue_tokens: 256
  localize_score: sum            # sum | mean log-prob of the candidate name tokens
  localize_batch_size: 4
  localize_edges: regex          # variant E at eval: regex | competition (jsonl mode with graphs/)
  graph_field: graph             # VERIFY
  graph_schema: {}               # e.g. {nodes_key: nodes, edges_key: links, edge_src_key: source, ...}
  probe_layers: [-1]
  probe_max_files: 300
  memory_seq_len: 2048
